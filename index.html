<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Настройка Telegram-бота АС</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #111; color: #f5f1e9; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: 100%; max-width: 520px; padding: 28px; border: 1px solid #45413b; border-radius: 18px; background: #1b1a18; }
    h1 { margin: 0 0 8px; font-size: 25px; }
    p { color: #c7c0b5; }
    label { display: block; margin: 22px 0 8px; font-weight: 600; }
    input { width: 100%; padding: 14px; border: 1px solid #696157; border-radius: 10px; background: #101010; color: white; font-size: 16px; }
    button { width: 100%; margin-top: 16px; padding: 14px; border: 0; border-radius: 10px; background: #d5bd91; color: #17130d; font-size: 16px; font-weight: 700; }
    small { display: block; margin-top: 16px; color: #aaa296; }
    iframe { width: 100%; height: 110px; margin-top: 18px; border: 1px solid #45413b; border-radius: 10px; background: #fff; }
  </style>
</head>
<body>
  <main>
    <h1>Настройка Telegram-бота АС</h1>
    <p>Установите webhook, чтобы бот начал получать сообщения из Telegram.</p>
    <form method="POST" action="https://qsiderzmnpjjvccgzels.supabase.co/functions/v1/as-telegram-bot" target="setup-result" accept-charset="UTF-8">
      <input type="hidden" name="action" value="install">
      <label for="secret">TELEGRAM_WEBHOOK_SECRET</label>
      <input id="secret" name="secret" type="password" required autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Введите секрет из Supabase">
      <button type="submit">Установить webhook</button>
    </form>
    <small>Секрет отправляется напрямую в Supabase по защищённому HTTPS-соединению. Эта страница его не сохраняет. Не вводите здесь токен Telegram-бота.</small>
    <iframe name="setup-result" title="Результат установки" sandbox="allow-forms allow-scripts"></iframe>
  </main>
</body>
</html>
